<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moodboard</title><link rel="stylesheet" href="./styles/font.css"><link rel="stylesheet" href="./styles/tokens.css"><link rel="stylesheet" href="./app.css"></head><body>
<aside id="sidebar"><div class="sidebar-heading"><strong>Boards</strong><button id="sidebar-close" aria-label="Close boards">×</button></div><nav id="boards" aria-label="Boards"></nav><button id="new-board">＋ New board</button><div class="sidebar-bottom"><button id="archived-boards">Archived boards</button><button id="deleted-boards">Deleted boards</button></div></aside>
<main><header><button id="toggle-sidebar" aria-label="Show boards" title="Boards">☰</button><input id="title" aria-label="Board title" value="Mood board" maxlength="100"><span id="save-status" role="status">Connecting…</span><button id="pick" title="Choose images from Ink" aria-label="Choose images from Ink" disabled>▧</button><button id="upload" title="Add images" aria-label="Add images" disabled>＋</button><input id="file-input" type="file" accept="image/*" multiple hidden></header>
<section id="scroll" aria-label="Board images"><div id="empty"><button id="empty-add" disabled><span>＋</span><strong>Drop images here</strong></button></div><div id="board" role="list" aria-label="Mood board images"></div></section>
<div id="notice" role="status" hidden><span></span><button id="undo" hidden>Undo</button><button id="dismiss" aria-label="Dismiss notification">×</button></div></main>
<dialog id="viewer"><header><strong id="viewer-title"></strong><button id="viewer-download" aria-label="Download image">Download</button><button id="viewer-remove" aria-label="Remove image from board">Remove</button><button id="viewer-close" aria-label="Close preview">×</button></header><div id="viewer-content"></div></dialog>
<dialog id="board-history"><header><strong id="history-title"></strong><button id="history-close" aria-label="Close board history">×</button></header><div id="history-list"></div></dialog>
<script type="module" src="./app.mjs"></script></body></html>
